<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1a2233"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#7ee787"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="70" y="110" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="64" font-weight="700" fill="#ffffff">∇ pi-train-agents</text>
  <text x="70" y="170" font-family="ui-monospace,Menlo,monospace" font-size="28" fill="#9ecbff">gradient descent for your AGENTS.md</text>
  <text x="70" y="228" font-family="ui-monospace,Menlo,monospace" font-size="20" fill="#8b949e">evidence-backed · human-gated · Pi-native</text>

  <!-- budget bar -->
  <rect x="70" y="270" width="720" height="26" rx="13" fill="#21262d"/>
  <rect x="70" y="270" width="412" height="26" rx="13" fill="url(#accent)"/>
  <text x="800" y="290" font-family="ui-monospace,Menlo,monospace" font-size="20" fill="#c9d1d9">2,412 / 5,000 tok</text>

  <!-- pipeline: tier1 -> tier2 -> gates -> review -->
  <g font-family="ui-monospace,Menlo,monospace" font-size="20" fill="#c9d1d9">
    <rect x="70" y="360" width="230" height="90" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="90" y="395" font-size="18" fill="#58a6ff">tier1 evidence</text>
    <text x="90" y="425" font-size="14" fill="#8b949e">per-session distillation</text>

    <rect x="340" y="360" width="230" height="90" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="360" y="395" font-size="18" fill="#58a6ff">tier2 synthesis</text>
    <text x="360" y="425" font-size="14" fill="#8b949e">semantic judgment</text>

    <rect x="610" y="360" width="230" height="90" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="630" y="395" font-size="18" fill="#58a6ff">mechanical gates</text>
    <text x="630" y="425" font-size="14" fill="#8b949e">traceable + batch + budget</text>

    <rect x="880" y="360" width="230" height="90" rx="14" fill="#161b22" stroke="#7ee787"/>
    <text x="900" y="395" font-size="18" fill="#7ee787">human review</text>
    <text x="900" y="425" font-size="14" fill="#8b949e">the only write path</text>

    <path d="M300 405 H338" stroke="#30363d" stroke-width="3" fill="none"/>
    <path d="M570 405 H608" stroke="#30363d" stroke-width="3" fill="none"/>
    <path d="M840 405 H878" stroke="#7ee787" stroke-width="3" fill="none"/>

    <text x="70" y="510" font-size="16" fill="#8b949e">pi install npm:pi-train-agents</text>
    <text x="70" y="540" font-size="14" fill="#484f58">/train-agents · analyze · propose · review · status</text>
  </g>
</svg>
